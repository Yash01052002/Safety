name: suraksha
description: Women's safety app with live location sharing and shake-to-alert SOS.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Sensors — shake detection
  sensors_plus: ^4.0.2

  # Location + background tracking
  geolocator: ^11.0.0
  flutter_background_service: ^5.0.5
  flutter_local_notifications: ^17.0.0

  # Contacts + comms fallback
  flutter_contacts: ^1.1.7+1
  url_launcher: ^6.2.5        # tel:/sms: fallbacks
  permission_handler: ^11.3.0

  # Maps
  google_maps_flutter: ^2.6.0

  # Backend (Firebase — Phase 0/1). Swap for a custom API behind a repo interface later.
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_messaging: ^14.7.19

  # Local persistence / offline queue
  shared_preferences: ^2.2.2

  # Utils
  intl: ^0.19.0
  battery_plus: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
