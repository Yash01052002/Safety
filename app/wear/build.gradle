// Wear OS companion module. Standalone Android module (not a Flutter module);
// add `include ':wear'` to android/settings.gradle after `flutter create .`
// generates the host project. Build: `./gradlew :wear:assembleDebug`.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'app.suraksha.wear'
    compileSdk 34

    defaultConfig {
        applicationId 'app.suraksha'      // must match the phone app id to pair
        minSdk 30                          // Wear OS 3+
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildFeatures { compose true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.11' }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.0'
    implementation 'androidx.activity:activity-compose:1.9.0'

    // Compose for Wear OS
    implementation platform('androidx.compose:compose-bom:2024.05.00')
    implementation 'androidx.wear.compose:compose-material:1.3.1'
    implementation 'androidx.wear.compose:compose-foundation:1.3.1'
    implementation 'androidx.compose.ui:ui-tooling-preview'

    // Phone <-> watch messaging + open-on-phone
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'
    implementation 'androidx.wear:wear-remote-interactions:1.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.0'
}
